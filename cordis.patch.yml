# dsh-plan-book 这个包带进 profile 的唯一一行（bundle 层）。
#
# 关键：`insert` 里**相对路径**的 name 会被锚定到**本文件所在目录**
# （@deepseek-ai/dsh-app-boot 的 anchorInsertedPluginNames：`new URL(name, patch 文件)`）；
# 这里用的是**裸包名**（`dsh-plan-book`），按 Node 的常规解析链走 profile 的 node_modules ——
# 也就是 pnpm 刚装进去的那份。
#
# 本包**不动**任何官方行（不抢 sidebar.brand.* 单值插槽，所以没有 disabled 行）；
# 目标行不存在时 Loader 只给一条 warning，不会失败。
#
# 也**没有页面开关**：一行 = 一个包 = 一页（或多页），开关那一套（`pages.*`）已经删掉 ——
# 上一版靠它"同一份整页代码复制四份、只开一页"，几个包一起装就会互相覆盖。

- insert:
    # 主机半边（本包的 main）；同一个包还提供客户端半边（`exports["./client"]` = lib/client.js）。
    - id: plan-book
      name: dsh-plan-book
      config:
        dshHome: ""
        planBook:
          enabled: true
